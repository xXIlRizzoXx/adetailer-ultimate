name: Test

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
      - "javascript/**"
      - "style.css"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
      - "javascript/**"
      - "style.css"
      - "README.md"
      - "CHANGELOG.md"
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  unit-windows:
    name: Unit tests on Windows / Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Run tests without detector downloads
        run: uv run --all-extras pytest -v -m "not integration"

  test:
    name: Test on python ${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --all-extras --with 'git+https://github.com/ultralytics/CLIP.git' pytest -v
